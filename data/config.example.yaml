# Optional: your commit emails, so your own pushes are recognized even when an email is
# not linked to your forge account (compared case-insensitively). Applies to every
# instance; an instance with its own `emails:` list uses that list instead.
# Bugzilla instances also use them to recognize your own comments and changes.
emails: [you@example.org]

# Optional: the branch changes made from the web UI are committed to (default: config).
# Keep it local: this file and items.yaml belong there, not on the branches you publish.
# commit_branch: config

# Instances to poll. Tokens live in .env; token_env names the variable.
# `url` is the API base for GitHub, GitLab and Forgejo, and the web base for Bugzilla.
instances:
  - id: github
    type: github
    url: https://api.github.com
    user: your-github-login
    token_env: GITHUB_TOKEN
    # emails: [you@work.example]   # replaces the top-level list for this instance

  - id: kde
    type: gitlab
    url: https://invent.kde.org/api/v4
    user: your-kde-login
    token_env: KDE_GITLAB_TOKEN

  - id: codeberg
    type: forgejo
    url: https://codeberg.org/api/v1
    user: your-codeberg-login
    token_env: CODEBERG_TOKEN
    timeout: 90                    # seconds per request (default 30): Codeberg's searches are slow when it is busy

  - id: freebsd-bz
    type: bugzilla
    url: https://bugs.freebsd.org/bugzilla
    user: you@example.org          # your Bugzilla login email
    token_env: FREEBSD_BZ_KEY      # Bugzilla works anonymously too: drop this line to poll without a key
    # Email domains of the project's committers: their short comments ("Committed, thanks!")
    # count as a maintainer's. The bug's assignee always counts.
    maintainer_domains: [freebsd.org]

  # - id: kde-bz
  #   type: bugzilla
  #   url: https://bugs.kde.org
  #   user: you@example.org
  #   maintainer_domains: [kde.org]

  # - id: mozilla-bz
  #   type: bugzilla
  #   url: https://bugzilla.mozilla.org
  #   user: you@example.org
  #   maintainer_domains: [mozilla.com]

  # Radicle: no token. `url` is a radicle-httpd API base. `user` is your Radicle ID, or a list
  # of them if you use one per machine. Your own node watches every repo it seeds; on a public
  # seed, list the repos you send patches to (not ones your node seeds: they would show twice).
  # On repos where you are a delegate, every open issue and patch is tracked, and incoming
  # patches are important by default.
  # - id: radicle-seed
  #   type: radicle
  #   url: https://seed.radicle.garden/api/v1
  #   user: [did:key:z6Mk…laptop, did:key:z6Mk…desktop]
  #   repos: [rad:z3gqcJUoA1n9HaHKufZs5FCSGazv5]   # heartwood
  # - id: radicle-mine
  #   type: radicle
  #   url: https://radicle.example.org/api/v1      # your node's radicle-httpd
  #   user: [did:key:z6Mk…laptop, did:key:z6Mk…desktop]
  #   # web: https://radicle.example.org             # links (default: app.radicle.xyz/nodes/<host>)

# Optional filter tuning (these are the defaults).
filter:
  noise_patterns:
    - '^\+1$'
    - '^me too'
    - '^same here'
    - '^any update'
    - '^bump$'
  min_comment_length: 20
  bot_allowlist: []

# Optional: the MCP server (`watcher mcp`) only reads unless you allow it to change things.
# mcp:
#   read_only: true
